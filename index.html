<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MBSST Correspondence</title>
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Noto+Sans+Myanmar:wght@400;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#b3191f; --accent:#d9a521; --on-primary:#fff; --on-accent:#1b1410;
  --bg:#f6f1ea; --surface:#ffffff; --surface-2:#f0e9df; --text:#2a211c; --muted:#76685e; --line:#e5dbcf;
  --ok:#15803d; --warn:#b45309; --bad:#b91c1c; --info:#1d4ed8;
  --radius:14px; --fs:16px;
  --font-mnw:'Padauk'; --font-th:'Noto Sans Thai'; --font-en:'Inter';
  --shadow:0 1px 2px rgba(40,20,10,.05),0 10px 30px rgba(60,30,10,.08);
  --shadow-lg:0 20px 60px rgba(30,15,5,.25);
  --tint:color-mix(in srgb,var(--primary) 10%,var(--surface));
  --tint-2:color-mix(in srgb,var(--accent) 16%,var(--surface));
  --ease:cubic-bezier(.2,.8,.2,1);
}
html[data-theme="dark"]{
  --bg:#15110e; --surface:#201a16; --surface-2:#2a221d; --text:#f3ece4; --muted:#b3a597; --line:#3a3029;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  --tint:color-mix(in srgb,var(--primary) 26%,var(--surface));
  --tint-2:color-mix(in srgb,var(--accent) 22%,var(--surface));
}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
html[lang="th"] body{font-family:var(--font-th),var(--font-en),var(--font-mnw),system-ui,sans-serif;line-height:1.65}
html[lang="en"] body{font-family:var(--font-en),var(--font-th),var(--font-mnw),system-ui,sans-serif;line-height:1.6}
html[lang="mnw"] body{font-family:var(--font-mnw),var(--font-th),var(--font-en),system-ui,sans-serif;line-height:1.9}
.mnw{font-family:var(--font-mnw),'Noto Sans Myanmar',sans-serif;line-height:1.9}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;letter-spacing:-.01em}
a{color:var(--primary)}
h1,h2,h3{margin:0;line-height:1.35}
.muted{color:var(--muted)} .small{font-size:.85rem}
button,input,select,textarea{font:inherit;color:inherit}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:264px 1fr;grid-template-rows:auto 1fr;min-height:100vh}
.topbar{grid-column:1/-1;position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 20px;
  background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;min-width:0}
.brand-txt{display:flex;flex-direction:column;min-width:0}
.brand-txt b{font-size:1.05rem;letter-spacing:.02em}
.brand-txt span{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{flex:none;border-radius:50%;display:grid;place-items:center;overflow:hidden;filter:drop-shadow(0 2px 6px rgba(0,0,0,.15))}
.logo svg,.logo img{width:100%;height:100%;object-fit:contain}
.logo img{background:#fff}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:999px;cursor:pointer;font-size:.85rem;color:var(--muted);transition:all .25s var(--ease)}
.seg button.on{background:var(--primary);color:var(--on-primary);box-shadow:0 2px 8px color-mix(in srgb,var(--primary) 40%,transparent)}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:12px;display:inline-grid;place-items:center;cursor:pointer;transition:transform .2s var(--ease),background .2s;flex:none}
.icon-btn:hover{background:var(--tint);transform:translateY(-1px)}
.icon-btn svg{width:18px;height:18px}
.menu-btn{display:none}
.sidebar{position:sticky;top:61px;height:calc(100vh - 61px);overflow:auto;padding:18px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:4px}
.nav-a{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;text-decoration:none;color:var(--text);position:relative;transition:background .2s,transform .2s var(--ease)}
.nav-a svg{width:19px;height:19px;flex:none;color:var(--muted);transition:color .2s}
.nav-a:hover{background:var(--surface-2);transform:translateX(2px)}
.nav-a.on{background:var(--tint);color:var(--primary);font-weight:600}
.nav-a.on svg{color:var(--primary)}
.nav-a.on::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--primary)}
.nav-sep{height:1px;background:var(--line);margin:10px 6px}
.nav-foot{margin-top:auto;font-size:.75rem;color:var(--muted);padding:10px;border:1px dashed var(--line);border-radius:12px;line-height:1.5}
.scrim{display:none}
main{padding:28px clamp(16px,3vw,40px) 60px;min-width:0;outline:none}
.footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between}

/* ---------- components ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.btn{--b:var(--surface);position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--b);
  padding:9px 16px;border-radius:12px;cursor:pointer;text-decoration:none;color:var(--text);font-weight:500;transition:transform .18s var(--ease),box-shadow .2s,background .2s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn:active{transform:translateY(0) scale(.98)}
.btn svg{width:17px;height:17px}
.btn.primary{background:var(--primary);border-color:transparent;color:var(--on-primary)}
.btn.accent{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.btn.danger{background:var(--bad);border-color:transparent;color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:.85rem;border-radius:10px}
.btn[disabled]{opacity:.5;pointer-events:none}
.ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.25;animation:ripple .6s ease-out;pointer-events:none}
@keyframes ripple{to{transform:scale(4);opacity:0}}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:600;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.admin-on{background:var(--accent);color:var(--on-accent);border-color:transparent;cursor:pointer}
.badge{display:inline-flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.72rem;padding:3px 8px;border-radius:8px;color:#fff;letter-spacing:.04em}
.st{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:999px}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.draft{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.st.issued,.st.received,.st.approved{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.st.void,.st.returned{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.st.submitted{color:var(--info);background:color-mix(in srgb,var(--info) 12%,transparent)}
.st.review{color:var(--accent);background:var(--tint-2)}
.st.paid{color:var(--ok);background:color-mix(in srgb,var(--ok) 22%,transparent)}
.sec-h{font-weight:700;font-size:.95rem;margin:18px 0 10px;padding:7px 12px;border-radius:10px;background:var(--tint-2);color:var(--primary)}
.chk-row{display:flex;flex-wrap:wrap;gap:6px 16px;padding:6px 0}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:.9rem;cursor:pointer}
.budget-pv{font-size:.85rem;padding:8px 12px;border-radius:10px;background:var(--surface-2);margin-top:6px}
.budget-pv:empty{display:none}
.budget-pv.bad{color:var(--bad)}
.seg.wrap{flex-wrap:wrap;border-radius:18px}
dl.kv .kv-sec{grid-column:1/-1;font-weight:700;color:var(--primary);border-bottom:1px solid var(--line);padding-top:10px}
.inp{width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface);transition:border .2s,box-shadow .2s}
.inp:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 16%,transparent)}
textarea.inp{resize:vertical}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld>span{font-size:.85rem;font-weight:600;color:var(--muted)}
.fld>span i{color:var(--bad);font-style:normal;margin-left:3px}
.fld.err .inp{border-color:var(--bad);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.inline{display:flex;gap:8px}
.link-row{display:grid;grid-template-columns:1fr 1.6fr auto;gap:8px;margin-bottom:8px;animation:fadeUp .3s var(--ease)}
.page-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.page-head h2{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.page-head .spacer{flex:1}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .inp{width:auto;min-width:140px}
.search{position:relative;flex:1;min-width:200px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;color:var(--muted)}
.search .inp{padding-left:38px;width:100%}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow:auto}
.tabs button{border:0;background:none;padding:10px 16px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;transition:all .2s;white-space:nowrap}
.tabs button.on{color:var(--primary);border-color:var(--primary)}
.empty{text-align:center;padding:40px;color:var(--muted)}
.empty svg{width:42px;height:42px;opacity:.5}
.flag{display:inline-block;font-size:.7rem;padding:1px 6px;border-radius:6px;font-weight:700}
.flag.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.flag.dr{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.flag.no{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}

/* ---------- animation ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
.view{animation:fadeUp .45s var(--ease)}
.stagger>*{animation:fadeUp .5s var(--ease) both;animation-delay:calc(var(--i,0)*55ms)}
html.no-anim *,html.no-anim *::before{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- home ---------- */
.hero{position:relative;overflow:hidden;display:flex;gap:28px;align-items:center;padding:30px;border-radius:calc(var(--radius) + 8px);
  background:linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--primary) 60%,var(--accent)));color:var(--on-primary);box-shadow:var(--shadow-lg);margin-bottom:24px}
.hero::after{content:"";position:absolute;right:-80px;top:-80px;width:320px;height:320px;border-radius:50%;border:40px solid rgba(255,255,255,.07)}
.hero h1{font-size:clamp(1.3rem,2.6vw,2rem)}
.hero .eyebrow{opacity:.8;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase}
.hero-sub{opacity:.9;margin:6px 0 16px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.hero .btn{background:rgba(255,255,255,.14);color:inherit;border-color:rgba(255,255,255,.25)}
.hero .btn.accent{background:var(--accent);color:var(--on-accent);border-color:transparent}
.hero-logo{animation:spinIn 1s var(--ease)}
@keyframes spinIn{from{transform:rotate(-120deg) scale(.6);opacity:0}to{transform:none;opacity:1}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat{display:flex;gap:14px;align-items:center;transition:transform .25s var(--ease)}
.stat:hover{transform:translateY(-3px)}
.stat .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--tint);color:var(--primary)}
.stat .ic svg{width:22px}
.stat b{font-size:1.7rem;display:block;line-height:1.1}
.stat span{font-size:.82rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.card h3{font-size:1.05rem;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.list-row{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:10px;cursor:pointer;transition:background .2s}
.list-row:hover{background:var(--surface-2)}
.list-row .grow{flex:1;min-width:0}
.list-row .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{display:grid;grid-template-columns:52px 1fr 28px;align-items:center;gap:10px;margin:7px 0;font-size:.85rem}
.bar i{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden;display:block}
.bar i em{display:block;height:100%;border-radius:6px;width:0;transition:width 1s var(--ease)}
.qlinks a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--text)}
.qlinks a:hover{background:var(--surface-2)}
.qlinks svg{width:16px;color:var(--primary)}

/* ---------- issue ---------- */
.type-group{margin-bottom:26px}
.type-group>h3{font-size:.9rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.tcard{text-align:left;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:16px;position:relative;overflow:hidden;
  transition:transform .25s var(--ease),box-shadow .25s,border-color .25s}
.tcard::after{content:"";position:absolute;inset:auto -30px -30px auto;width:90px;height:90px;border-radius:50%;background:var(--c);opacity:.08;transition:transform .4s var(--ease)}
.tcard:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--c)}
.tcard:hover::after{transform:scale(2.4)}
.tcard .nm{font-weight:600;margin:10px 0 2px;font-size:1.02rem}
.tcard .ds{font-size:.82rem;color:var(--muted);min-height:2.6em}
.tcard .nx{margin-top:10px;font-size:.78rem;color:var(--muted)}
.tcard .nx b{color:var(--text)}
.issue-layout{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
.sticky{position:sticky;top:84px}
.preview{text-align:center;background:linear-gradient(180deg,var(--tint),var(--surface))}
.pv-label{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.pv-no{font-size:1.45rem;font-weight:700;color:var(--primary);margin:10px 0;padding:14px;border:2px dashed color-mix(in srgb,var(--primary) 45%,transparent);border-radius:14px;transition:transform .3s var(--ease)}
.pv-no.bump{animation:bump .4s var(--ease)}
@keyframes bump{50%{transform:scale(1.06)}}
.pv-actions{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.quorum{font-size:.85rem;font-weight:600;padding:8px 12px;border-radius:10px}
.stamp-wrap{display:grid;place-items:center;padding:20px 0 6px}
.stamp{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 28px;border:4px double var(--primary);border-radius:16px;color:var(--primary);
  transform:rotate(-6deg);animation:stamp .7s var(--ease) both;background:color-mix(in srgb,var(--primary) 6%,transparent)}
.stamp b{font-size:1.55rem}
.stamp small{letter-spacing:.3em;font-weight:700}
@keyframes stamp{0%{transform:scale(2.4) rotate(-18deg);opacity:0}60%{transform:scale(.94) rotate(-5deg);opacity:1}100%{transform:scale(1) rotate(-6deg)}}
.burst{position:fixed;width:9px;height:9px;border-radius:50%;pointer-events:none;z-index:200;animation:burst .9s var(--ease) forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(.3);opacity:0}}

/* ---------- table ---------- */
.tbl-wrap{overflow:auto;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-size:.78rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;background:var(--surface-2);padding:11px 14px;white-space:nowrap}
td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover{background:var(--tint)}
tr.is-void td{opacity:.55} tr.is-void .mono{text-decoration:line-through}

/* ---------- requests ---------- */
.req-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.rcard{cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s;display:flex;flex-direction:column;gap:8px}
.rcard:hover{transform:translateY(-3px)}
.rcard .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rcard .ttl{font-weight:600;font-size:1.02rem}
.steps{display:flex;gap:4px;margin-top:6px}
.steps i{flex:1;height:5px;border-radius:4px;background:var(--surface-2)}
.steps i.on{background:var(--primary)}
.steps i.bad{background:var(--bad)}
.obj-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.obj{border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;transition:all .2s}
.obj input{margin-top:5px;accent-color:var(--primary)}
.obj:has(input:checked){border-color:var(--primary);background:var(--tint)}
.obj b{font-family:'JetBrains Mono',monospace}
.obj .mnw{font-size:.8rem;color:var(--muted);display:block;line-height:1.6}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;cursor:pointer;transition:all .25s;color:var(--muted)}
.drop svg{width:30px;height:30px;color:var(--primary)}
.drop.over{border-color:var(--primary);background:var(--tint);transform:scale(1.01)}
.files{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.file{display:flex;align-items:center;gap:10px;padding:7px 10px;background:var(--surface-2);border-radius:10px;font-size:.85rem;animation:fadeUp .3s var(--ease)}
.file .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.items td,.items th{padding:6px}
.items .inp{padding:7px 9px}
.code-pv{font-size:1.3rem;font-weight:700;color:var(--primary);text-align:center;padding:12px;border-radius:12px;background:var(--tint);margin:8px 0}
.timeline-mini{border-left:2px solid var(--line);padding-left:14px;margin-left:6px}
.timeline-mini div{position:relative;padding:4px 0 10px;font-size:.85rem}
.timeline-mini div::before{content:"";position:absolute;left:-20px;top:10px;width:10px;height:10px;border-radius:50%;background:var(--primary)}

/* ---------- members / activities / history ---------- */
.mem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mcard{display:flex;gap:14px;align-items:center;transition:transform .25s var(--ease)}
.mcard:hover{transform:translateY(-3px)}
.avatar{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:1.3rem;font-weight:700;color:var(--on-primary);
  background:linear-gradient(135deg,var(--primary),var(--accent))}
.mcard .nm{font-weight:600;line-height:1.5}
.act-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.acard{padding:0;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s var(--ease)}
.acard:hover{transform:translateY(-4px)}
.acard .img{height:140px;background:linear-gradient(135deg,var(--tint),var(--tint-2));display:grid;place-items:center;color:var(--primary)}
.acard .img img{width:100%;height:100%;object-fit:cover}
.acard .img svg{width:40px;opacity:.5}
.acard .bd{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.acard .dt{font-size:.8rem;color:var(--accent);font-weight:700}
.tl{position:relative;padding-left:34px;max-width:820px}
.tl::before{content:"";position:absolute;left:12px;top:6px;bottom:6px;width:3px;border-radius:3px;background:linear-gradient(var(--primary),var(--accent))}
.tl-item{position:relative;margin-bottom:18px}
.tl-item::before{content:"";position:absolute;left:-29px;top:20px;width:15px;height:15px;border-radius:50%;background:var(--surface);border:4px solid var(--primary);box-shadow:0 0 0 4px var(--bg)}
.tl-item .yr{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--primary);font-size:.85rem}
.tl-item h4{margin:4px 0;font-size:1.05rem}

/* ---------- settings ---------- */
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:46px;height:46px;border-radius:14px;cursor:pointer;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);transition:transform .2s var(--ease);position:relative;overflow:hidden}
.sw:hover{transform:scale(1.1)}
.sw i{position:absolute;right:0;bottom:0;width:50%;height:50%}
.sw.on{box-shadow:0 0 0 3px var(--primary)}
.color-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.color-row input[type=color]{width:46px;height:38px;border:1px solid var(--line);border-radius:10px;background:none;padding:2px;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--primary)}
.font-sample{padding:10px 12px;border-radius:10px;background:var(--surface-2);margin-top:6px;font-size:1.05rem}
.txt-row{display:grid;grid-template-columns:150px 1fr 1fr 1fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.txt-row code{font-size:.75rem;color:var(--muted);word-break:break-all}
.txt-row .inp{padding:7px 9px;font-size:.88rem}
.switch{position:relative;display:inline-block;width:44px;height:24px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;border-radius:24px;background:var(--line);cursor:pointer;transition:.25s}
.switch span::before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.25s var(--ease)}
.switch input:checked+span{background:var(--primary)}
.switch input:checked+span::before{transform:translateX(20px)}
.sheet-tbl td{font-size:.8rem;cursor:default}
.sheet-tbl tbody tr:hover{background:none}
.log{font-size:.8rem;max-height:220px;overflow:auto}
.log div{padding:5px 0;border-bottom:1px dashed var(--line)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--tint-2);font-size:.85rem;margin-bottom:16px}
.banner svg{width:18px;flex:none;margin-top:2px;color:var(--accent)}

/* ---------- modal & toast ---------- */
.modal-wrap{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px}
.modal-backdrop{position:absolute;inset:0;background:rgba(20,12,6,.5);backdrop-filter:blur(4px);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.modal{position:relative;width:min(560px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:var(--surface);border-radius:calc(var(--radius) + 6px);box-shadow:var(--shadow-lg);animation:pop .32s var(--ease)}
.modal.lg{width:min(860px,100%)}
.modal-head{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-head h3{flex:1;font-size:1.15rem;display:flex;align-items:center;gap:10px}
.modal-body{padding:20px 22px;overflow:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal-wrap.out .modal{animation:pop .2s reverse forwards}
.modal-wrap.out .modal-backdrop{opacity:0;transition:opacity .2s}
dl.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;margin:0;font-size:.92rem}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;word-break:break-word}
#toast-root{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{display:flex;align-items:center;gap:10px;padding:11px 18px;border-radius:14px;background:var(--text);color:var(--bg);box-shadow:var(--shadow-lg);animation:pop .3s var(--ease);font-size:.9rem}
.toast svg{width:18px}
.toast.ok svg{color:#4ade80} .toast.bad svg{color:#f87171}
.toast.out{opacity:0;transform:translateY(10px);transition:all .3s}

.sync{display:inline-grid;place-items:center;width:30px;height:30px;color:var(--ok)}
.sync svg{width:20px;height:20px}
.sync.on{color:var(--accent);animation:pulse 1s ease-in-out infinite}
.sync.off{color:var(--bad)}
@keyframes pulse{50%{opacity:.35;transform:scale(.9)}}
.btn.loading{pointer-events:none;opacity:.65}
.btn.loading::after{content:"";width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---------- member profile ---------- */
.avatar{overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.mcard{cursor:pointer}
.profile{padding:0;overflow:hidden}
.pf-cover{height:140px;background:linear-gradient(135deg,var(--primary),var(--accent));position:relative;overflow:hidden}
.pf-cover::after{content:"";position:absolute;right:-40px;top:-60px;width:240px;height:240px;border-radius:50%;border:34px solid rgba(255,255,255,.09)}
.pf-main{display:flex;gap:20px;align-items:flex-end;padding:0 24px;margin-top:-60px;position:relative}
.pf-ava{width:128px;height:128px;border-radius:50%;border:5px solid var(--surface);overflow:hidden;background:linear-gradient(135deg,var(--primary),var(--accent));display:grid;place-items:center;font-size:2.8rem;font-weight:700;color:var(--on-primary);flex:none;box-shadow:var(--shadow);animation:pop .5s var(--ease)}
.pf-ava img{width:100%;height:100%;object-fit:cover}
.pf-main h2{font-size:1.5rem}
.pf-main>div:last-child{padding-top:68px}
.pf-body{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;padding:20px 24px 26px}
.bio{white-space:pre-line;line-height:1.9}
.pf-photo{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.pf-img{width:96px;height:96px;border-radius:50%;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);flex:none;border:3px solid var(--line)}
.pf-img img{width:100%;height:100%;object-fit:cover;animation:pop .35s var(--ease)}
.pf-img svg{width:40px}
.priv{border:1px dashed var(--line);border-radius:14px;padding:14px 14px 2px;margin-bottom:12px;background:var(--surface-2)}
.priv-h{font-weight:700;font-size:.85rem;margin-bottom:10px;color:var(--muted)}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:.88rem;margin:6px 0}
.consent input{margin-top:6px;accent-color:var(--primary)}
@media (max-width:640px){.pf-main{flex-direction:column;align-items:center;text-align:center}.pf-main>div:last-child{padding-top:0}.pf-body{grid-template-columns:1fr}}

/* ---------- print ---------- */
#print-root{display:none}
.ps{position:relative;font-size:12pt;line-height:1.65;color:#000;background:#fff}
.ps .wm{position:fixed;left:50%;top:50%;width:130mm;height:130mm;object-fit:contain;transform:translate(-50%,-50%);opacity:.07;z-index:0;pointer-events:none}
.ps>*:not(.wm){position:relative;z-index:1}
.ps .ph{display:flex;align-items:center;gap:14px;border-bottom:2px solid var(--primary);padding-bottom:10px;margin-bottom:14px}
.ps .ph img{width:62px;height:62px;object-fit:contain}
.ps .ph .mnw{font-size:13.5pt;font-weight:700;line-height:1.5}
.ps h2{font-size:15pt;text-align:center;margin:8px 0 14px}
.ps table{width:100%;border-collapse:collapse;font-size:10pt}
.ps th,.ps td{border:1px solid #888;padding:5px 7px;text-align:left;vertical-align:top}
.ps th{background:#f3ece2;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ps .kv{display:grid;grid-template-columns:36mm 1fr;gap:4px 12px;margin:8px 0}
.ps .kv b{font-weight:600}
.ps .row{display:flex;justify-content:space-between;gap:12px}
.ps .body{min-height:85mm;margin:12px 0;border-top:1px dotted #bbb;padding-top:8px;color:#444}
.ps .signs{display:flex;justify-content:space-around;gap:12px;margin-top:16mm;text-align:center;font-size:11pt}
.ps .sign{margin:16mm 0 0 52%;text-align:center}
.ps .void{position:absolute;right:0;top:0;border:3px solid #b91c1c;color:#b91c1c;font-weight:800;font-size:18pt;padding:2px 12px;transform:rotate(-8deg)}
.ps .pphoto{width:34mm;height:34mm;object-fit:cover;border-radius:50%;border:2px solid #ddd;float:right;margin:0 0 8px 12px}
.ps .ptitle{text-align:center;margin:2px 0 8px;line-height:1.45}
.ps .ptitle>.mnw{font-size:14pt;font-weight:700}
.ps .pt{font-size:9.5pt;margin-bottom:6px}
.ps .pt td{width:25%}
.ps .pt.sg td{width:33.3%;line-height:2}
.ps .pt th.sec{text-align:left;font-weight:700}
.ps .pt small{color:#555;font-size:8pt}
.ps tr{break-inside:avoid}
.ps .pf{position:fixed;bottom:0;left:0;right:0;font-size:8.5pt;color:#666;display:flex;justify-content:space-between;border-top:1px solid #ddd;padding-top:4px}
/* ---------- overview / member / AI ---------- */
.me-chip{text-decoration:none;color:inherit;max-width:190px;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.gate{max-width:540px;margin:40px auto;text-align:center}
.ov-thumb{width:46px;height:46px;border-radius:10px;object-fit:cover;flex:none;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.ov-faces{display:flex;flex-wrap:wrap;gap:8px}
.ov-faces a{text-decoration:none;color:inherit}
.ov-faces .avatar{width:44px;height:44px;font-size:1rem}
.work-row{display:grid;grid-template-columns:1.6fr 84px 2fr auto auto;gap:8px;align-items:center;margin-bottom:8px}
.works{display:flex;flex-direction:column;gap:6px}
.work{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--surface-2);text-decoration:none;color:inherit}
a.work[href]:hover{background:var(--tint-2)}
.ai-bar{display:grid;grid-template-columns:220px minmax(0,1fr) auto;gap:14px;align-items:end;margin-bottom:14px}
.ai-bar .fld{margin:0}
.ai-meta{padding-bottom:10px;white-space:nowrap}
.ai-chat{min-height:44vh;max-height:62vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.ai-empty{text-align:center;margin:auto;max-width:640px;color:var(--muted);padding:10px}
.ai-empty>svg{color:var(--primary)}
.ai-empty h3{justify-content:center;color:var(--text);margin:8px 0 4px}
.ai-quick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.ai-msg{display:flex}
.ai-msg.me{justify-content:flex-end}
.ai-bubble{max-width:min(780px,94%);padding:10px 14px;border-radius:16px;background:var(--surface-2);line-height:1.65;overflow-wrap:anywhere}
.ai-msg.me .ai-bubble{background:var(--primary);color:var(--on-primary);border-bottom-right-radius:4px;white-space:pre-wrap}
.ai-msg.bot .ai-bubble{border-bottom-left-radius:4px}
.ai-bubble.err{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.md p{margin:.3em 0}.md ul,.md ol{margin:.3em 0 .3em 1.3em;padding:0}.md h4{margin:.7em 0 .2em;font-size:1rem}
.md code{font-family:'JetBrains Mono',monospace;font-size:.85em;background:var(--surface);padding:1px 5px;border-radius:5px}
.md-tbl{border-collapse:collapse;font-size:.88rem;margin:.4em 0}.md-tbl th,.md-tbl td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.ai-foot{display:flex;align-items:center;gap:8px;margin-top:6px;justify-content:space-between}
.ai-input{display:flex;gap:10px;align-items:flex-end;margin-top:14px}
.ai-input textarea{flex:1;resize:vertical;min-height:52px}
.dots{display:inline-flex;gap:3px;vertical-align:middle}.dots i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:dot 1s infinite ease-in-out}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
.ai-key-row{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.ai-key-row .inline .inp{flex:1;min-width:0}
.code-hint{font-family:'JetBrains Mono',monospace;font-size:.8rem;background:var(--surface-2);padding:8px 10px;border-radius:8px;overflow:auto;margin-top:12px;white-space:pre-wrap}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){#sync,.me-out{display:none}.top-actions{gap:6px}}
@media (max-width:700px){.ai-bar{grid-template-columns:1fr}.ai-meta{white-space:normal;padding:0}.work-row{grid-template-columns:1fr 72px}.work-row [data-k=url]{grid-column:1/-1}.ai-input{flex-direction:column;align-items:stretch}}
@media print{
  @page{size:A4;margin:15mm 17mm 18mm}
  html,body{background:#fff!important}
  body>*:not(#print-root){display:none!important}
  #print-root{display:block}
}
/* ---------- responsive ---------- */
@media (max-width:1100px){.stats{grid-template-columns:1fr 1fr}.grid2,.set-grid{grid-template-columns:1fr}.issue-layout{grid-template-columns:1fr}.sticky{position:static}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .menu-btn{display:inline-grid}
  .sidebar{position:fixed;left:0;top:0;bottom:0;height:100vh;width:280px;z-index:60;transform:translateX(-105%);transition:transform .35s var(--ease);box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:none}
  .scrim{display:block;position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s}
  .scrim.open{opacity:1;pointer-events:auto}
  .brand-txt span{display:none}
}
@media (max-width:640px){
  html,body{overflow-x:hidden}
  .topbar{padding:8px 12px;gap:6px}
  .brand-txt,.hide-sm{display:none}
  .top-actions{gap:6px}
  .seg button{padding:4px 8px}
  main{padding:20px 16px 48px}
  .page-head{gap:10px}
  .page-head h2{font-size:1.25rem;width:100%}
  .page-head .spacer{display:none}
  .toolbar .inp{flex:1 1 140px;min-width:0}
  .search{min-width:100%}
  .hero{flex-direction:column;text-align:center;padding:24px}
  .hero-actions{justify-content:center}
  .row2,.row3,.obj-grid{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr;gap:10px}
  .stat{flex-direction:column;align-items:flex-start;gap:8px}
  .link-row{grid-template-columns:1fr auto}
  .link-row input[data-k=label]{grid-column:1/-1}
  dl.kv{grid-template-columns:1fr}
  dl.kv dt{margin-top:6px}
  .txt-row{grid-template-columns:1fr}
  .tbl-wrap.resp{border:0;background:none}
  .resp table,.resp tbody,.resp tr,.resp td{display:block}
  .resp thead{display:none}
  .resp tr{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;padding:6px 4px}
  .resp td{border:0;padding:5px 12px;display:flex;justify-content:space-between;gap:12px}
  .resp td::before{content:attr(data-l);color:var(--muted);font-size:.78rem}
}
</style>

<body>
<div class="app" id="app">
  <header class="topbar" id="top"></header>
  <nav class="sidebar" id="sidebar" aria-label="main"></nav>
  <div class="scrim" id="scrim" onclick="App.toggleNav(false)"></div>
  <main id="main" tabindex="-1"></main>
</div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>
<div id="print-root"></div>

<script>
(() => {
'use strict';
/* =========================================================
   MBSST Saraban — UX/UI draft v0.1
   Data: browser storage (demo). Next phase: Google Sheets via Apps Script.
   ========================================================= */
const LS_KEY = 'mbsst_saraban_v1';

/* ---------- CONFIG: วาง Web app URL จาก Apps Script ตรงนี้ก่อนเผยแพร่บน GitHub Pages ---------- */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbzbxSZHTEyPsMbrIHCYR0cbFoY-xzcjwUWtNLtjPdLhU4_T3Gwz7CAgZMr6NFstiWk/exec'   // เช่น 'https://script.google.com/macros/s/XXXX/exec' · เว้นว่าง = โหมดสาธิต (เก็บในเบราว์เซอร์)
};
const API = CONFIG.API_URL || (() => { try { return localStorage.getItem('mbsst_api') || ''; } catch (e) { return ''; } })();
const KEY = {club: '', admin: ''};
try { KEY.club = localStorage.getItem('mbsst_key') || ''; KEY.admin = sessionStorage.getItem('mbsst_admin') || ''; } catch (e) {}
/* สมาชิกเข้าสู่ระบบด้วยเลขสมาชิก 8 หลัก + PIN → {no, pin, id} */
let SELF = null, ROLE = 'public';
try { SELF = JSON.parse(sessionStorage.getItem('mbsst_self') || localStorage.getItem('mbsst_self') || 'null'); } catch (e) {}
const RANK = {public: 0, self: 1, member: 2, admin: 3};
const myRole = () => API ? ROLE : (ADMIN ? 'admin' : SELF ? 'member' : 'public');
const can = r => RANK[myRole()] >= RANK[r];
let CONNECTED = false, busyN = 0;
const TBL = {docs: 'Docs', requests: 'Requests', members: 'Members', activities: 'Activities', history: 'History'};
const SHARED = ['primary','accent','radius','fs','anim','fonts','logo','texts','types','links','ai'];
async function api(action, payload = {}, key) {
  busyN++; syncUI();
  try {
    const k = key || KEY.admin || KEY.club;
    const auth = k ? {key: k} : SELF ? {mid: SELF.no, pin: SELF.pin} : {};
    const res = await fetch(API, {method: 'POST', body: JSON.stringify(Object.assign({action}, auth, payload))});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'error');
    return j;
  } finally { busyN--; syncUI(); }
}
function syncUI() { const el = document.getElementById('sync'); if (el) { el.classList.toggle('on', busyN > 0); el.classList.toggle('off', !CONNECTED && busyN === 0); } }
function apiErr(e) {
  const m = String((e && e.message) || e);
  const known = {code_wrong: 'code_wrong', unauthorized: 'err_auth', 'admin only': 'login_needed', pin_format: 'pin_format', ai_no_key: 'ai_no_key', ai_limit: 'ai_limit', ai_too_long: 'ai_too_long'};
  toast(known[m] ? T(known[m]) : T('err_net') + ' (' + m + ')', 'bad');
}
const shareTimers = {};
function shareSet(k) {
  if (!API || !ADMIN || SHARED.indexOf(k) < 0) return;
  clearTimeout(shareTimers[k]);
  shareTimers[k] = setTimeout(() => api('setSetting', {k, v: S.settings[k]}).catch(apiErr), 700);
}
async function persist(coll, obj) {
  if (!API) { save(); return obj; }
  const j = await api('upsert', {table: TBL[coll], obj});
  return j.obj;
}
async function removeRemote(coll, id) { if (API) await api('remove', {table: TBL[coll], id}); }
const fileToB64 = f => new Promise((ok, bad) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = bad; r.readAsDataURL(f); });
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const todayISO = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const nowISO = () => new Date().toISOString();
const curYear = () => new Date().getFullYear();
const pad = (n, d) => String(n).padStart(d, '0');
const safeUrl = u => /^(https?:|mailto:|tel:)/i.test(u || '') ? u : '#';
const hasMM = s => /[က-႟]/.test(s || '');
const mm = s => hasMM(s) ? `<span class="mnw">${esc(s)}</span>` : esc(s);
const money = n => (Number(n) || 0).toLocaleString('en-US');

/* ---------- icons ---------- */
const sv = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICON = {
  home: sv('<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/>'),
  stamp: sv('<path d="M9 3h6l-1 7h-4z"/><path d="M4 14h16v3H4z"/><path d="M6 20h12"/>'),
  list: sv('<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/>'),

function ink(hex) {

  const lum = (0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
  return lum > 0.62 ? '#1b1410' : '#ffffff';
}

  const s = S.settings, r = document.documentElement;
  r.style.setProperty('--primary', s.primary);
  r.style.setProperty('--accent', s.accent);
  r.style.setProperty('--on-primary', ink(s.primary));
  r.style.setProperty('--on-accent', ink(s.accent));
  r.style.setProperty('--radius', s.radius + 'px');

function modal({title, body, actions = [], size = ''}) {
  const el = document.createElement('div');
  el.className = 'modal-wrap';
  el.innerHTML = `<div class="modal-backdrop"></div><div class="modal ${size}" role="dialog" aria-modal="true">
    <div class="modal-head"><h3>${title}</h3><button class="icon-btn" data-x aria-label="close">${ICON.x}</button></div>
    <div class="modal-body">${body}</div>${actions.length ? '<div class="modal-foot"></div>' : ''}</div>`;
  $('#modal-root').appendChild(el);
  const onKey = e => { if (e.key === 'Escape' && el === $('#modal-root').lastElementChild) close(); };
  const close = () => { el.classList.add('out'); document.removeEventListener('keydown', onKey); setTimeout(() => el.remove(), 200); };
  document.addEventListener('keydown', onKey);
  el.querySelector('.modal-backdrop').onclick = close;
  el.querySelector('[data-x]').onclick = close;
  const foot = el.querySelector('.modal-foot');
  actions.forEach(a => {
    const b = document.createElement('button');
    b.className = 'btn ' + (a.cls || '');
    b.innerHTML = a.label;
    b.onclick = () => { const r = a.on ? a.on(el, close, b) : undefined; if (r !== false) close(); };
    foot.appendChild(b);
  });
  setTimeout(() => { const f = el.querySelector('.modal-body input:not([type=hidden]):not([type=file]),.modal-body textarea'); f && f.focus(); }, 80);
  return {el, close};
}
function toast(msg, kind = 'ok') {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = `${kind === 'bad' ? ICON.info : ICON.check}<span>${esc(msg)}</span>`;
  $('#toast-root').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 320); }, 2600);
}
function burst(x, y) {
  if (!S.settings.anim) return;
  const cols = [S.settings.primary, S.settings.accent, '#ffffff'];
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('i');
    p.className = 'burst';
    const a = Math.random() * Math.PI * 2, r = 60 + Math.random() * 90;
    p.style.cssText = `left:${x}px;top:${y}px;background:${cols[i % 3]};--x:${Math.cos(a) * r}px;--y:${Math.sin(a) * r}px`;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 950);
  }
}
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('.btn,.tcard');
  if (!b || !S.settings.anim) return;
  const r = b.getBoundingClientRect(), s = document.createElement('span');
  const size = Math.max(r.width, r.height);

  s.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - r.left - size / 2}px;top:${e.clientY - r.top - size / 2}px`;

function countUp() {

function shrinkImage(file, max) {
  return new Promise((ok, bad) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src); ok(c.toDataURL('image/jpeg', .86));
    };
    img.onerror = bad;
    img.src = URL.createObjectURL(file);
  });
}
/** ย่อรูปโปรไฟล์ให้เล็กพอเก็บในเซลล์ชีตได้โดยตรง (ไม่ต้องอัปโหลด Drive) — ไม่เกิน ~40,000 ตัวอักษร */
function smallPhoto(dataUrl, limit = 40000) {
  return new Promise((ok, bad) => {
    const img = new Image();
    img.onload = () => {
      for (const [max, q] of [[320, .82], [280, .72], [240, .62], [200, .55], [160, .5]]) {
        const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
        const u = c.toDataURL('image/jpeg', q);
        if (u.length <= limit) return ok(u);
      }
      bad(new Error('photo too large'));
    };
    img.onerror = bad;
    img.src = dataUrl;
  });
}

function mdHTML(src) {
  const inline = x => esc(x).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  const lines = String(src || '').replace(/\r/g, '').split('\n');
  let out = '', list = null, i = 0;
  const close = () => { if (list) { out += `</${list}>`; list = null; } };
  const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
  while (i < lines.length) {
    const l = lines[i]; let m;
    if (/^\s*\|.*\|\s*$/.test(l) && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1] || '')) {
      close();
      out += '<div class="tbl-wrap"><table class="md-tbl"><thead><tr>' + cells(l).map(c => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>';
      i += 2;
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { out += '<tr>' + cells(lines[i]).map(c => `<td>${inline(c)}</td>`).join('') + '</tr>'; i++; }
      out += '</tbody></table></div>';
      continue;
    }
    if ((m = /^#{1,6}\s+(.*)$/.exec(l))) { close(); out += `<h4>${inline(m[1])}</h4>`; }
    else if ((m = /^\s*[-*•]\s+(.*)$/.exec(l))) { if (list !== 'ul') { close(); out += '<ul>'; list = 'ul'; } out += `<li>${inline(m[1])}</li>`; }
    else if ((m = /^\s*\d+[.)]\s+(.*)$/.exec(l))) { if (list !== 'ol') { close(); out += '<ol>'; list = 'ol'; } out += `<li>${inline(m[1])}</li>`; }
    else if (!l.trim()) close();
    else { close(); out += `<p>${inline(l)}</p>`; }
    i++;
  }
  close();
  return out;
}

/* ---------- registry ---------- */
function viewRegistry() {
  const f = UI.reg;
  const years = [...new Set(S.data.docs.map(d => d.year))].sort((a, b) => b - a);
  let rows = S.data.docs.filter(d => {
    const g = typeOf(d.type) ? typeOf(d.type).g : 'out';
    if (f.tab === 'in' && g !== 'in') return false;
    if (f.tab === 'out' && g === 'in') return false;
    if (f.type && d.type !== f.type) return false;
    if (f.year && d.year !== +f.year) return false;
    if (f.status && d.status !== f.status) return false;
    if (f.q) { const q = f.q.toLowerCase(); if (![d.no, d.subject, d.to, d.from, d.code, d.ref].join(' ').toLowerCase().includes(q)) return false; }
    return true;
  }).sort((a, b) => b.year - a.year || a.type.localeCompare(b.type) || b.seq - a.seq);
  const isIn = f.tab === 'in';
  UI.lastRows = rows;
  return `<div class="view">
    <div class="page-head"><h2>${ICON.list.replace('<svg', '<svg width="26"')} ${mm(T('nav_registry'))}</h2><span class="spacer"></span>
      <button class="btn" onclick="App.printRegister()">${ICON.print} ${esc(T('print'))}</button>
      <button class="btn" onclick="App.exportCSV()">${ICON.download} ${esc(T('export_csv'))}</button>
      ${ADMIN ? `<a class="btn primary" href="#issue">${ICON.plus} ${mm(T('nav_issue'))}</a>` : ''}</div>
    <div class="tabs">${[['out','tab_out'],['in','tab_in'],['all','all']].map(([k, l]) => `<button class="${f.tab === k ? 'on' : ''}" onclick="App.regSet('tab','${k}')">${mm(T(l))}</button>`).join('')}</div>
    <div class="toolbar">
      <div class="search">${ICON.search}<input class="inp" placeholder="${esc(T('search'))} — ${esc(T('number'))}, ${esc(T('subject'))}…" value="${esc(f.q)}" oninput="App.regSet('q',this.value,true)"></div>
      <select class="inp" onchange="App.regSet('type',this.value)"><option value="">${esc(T('type'))}: ${esc(T('all'))}</option>${types().map(t => `<option value="${t.code}" ${f.type === t.code ? 'selected' : ''}>${t.code} · ${esc(L(t.n))}</option>`).join('')}</select>
      <select class="inp" onchange="App.regSet('year',this.value)"><option value="">${esc(T('year'))}: ${esc(T('all'))}</option>${years.map(y => `<option ${+f.year === y ? 'selected' : ''}>${y}</option>`).join('')}</select>
      <select class="inp" onchange="App.regSet('status',this.value)"><option value="">${esc(T('status'))}: ${esc(T('all'))}</option>${['draft','issued','received','void'].map(s => `<option value="${s}" ${f.status === s ? 'selected' : ''}>${esc(T('st_' + s))}</option>`).join('')}</select>
    </div>
    <div class="tbl-wrap resp" id="reg-table">${regTable(rows, isIn)}</div></div>`;
}
function regTable(rows, isIn) {
  if (!rows.length) return `<div class="empty">${ICON.file}<div>${esc(T('no_data'))}</div></div>`;
  return `<table><thead><tr><th>${esc(T('number'))}</th><th>${esc(T('date'))}</th><th>${esc(T('type'))}</th><th>${esc(T('subject'))}</th><th>${esc(isIn ? T('from') : T('to'))}</th><th>${esc(T('project_code'))}</th><th>${esc(T('status'))}</th></tr></thead><tbody>
    ${rows.map(d => `<tr class="${d.status === 'void' ? 'is-void' : ''}" onclick="App.openDoc('${d.id}')">
      <td data-l="${esc(T('number'))}"><b class="mono">${esc(d.no)}</b>${d.sample ? ` <span class="chip" style="font-size:.65rem">${esc(T('sample'))}</span>` : ''}</td>
      <td data-l="${esc(T('date'))}">${fmtDate(d.date)}</td>
      <td data-l="${esc(T('type'))}">${badge(d.type)}</td>
      <td data-l="${esc(T('subject'))}">${mm(d.subject)}</td>
      <td data-l="${esc(isIn ? T('from') : T('to'))}">${mm((typeOf(d.type) || {}).g === 'in' ? d.from : d.to) || '—'}</td>
      <td data-l="${esc(T('project_code'))}" class="mono small">${esc(d.code) || '—'}</td>
      <td data-l="${esc(T('status'))}">${stChip(d.status)}</td></tr>`).join('')}</tbody></table>`;
}

function setTexts() {
  const q = UI.txtQ.toLowerCase();
  const flagOf = k => { const o = S.settings.texts[k] || {}; const m = o.mnw || STR[k].mnw; if (!m) return 'no'; if (o.mnw) return 'ok'; return STR[k].v === 1 ? 'ok' : 'dr'; };
  const keys = Object.keys(STR).filter(k => {
    if (UI.txtFlag && flagOf(k) === 'ok') return false;
    if (!q) return true;
    return (k + ' ' + ['mnw','th','en'].map(l => L3(k, l)).join(' ')).toLowerCase().includes(q);
  });
  const fl = {ok: ['ok', T('flag_ok')], dr: ['dr', T('flag_dr')], no: ['no', T('flag_no')]};
  return `<div class="card">
    <div class="banner">${ICON.info}<span>${esc(T('mon_note'))}</span></div>

    ${keys.map(k => { const f = fl[flagOf(k)]; return `<div class="txt-row"><code>${k}<br><span class="flag ${f[0]}">${esc(f[1])}</span></code>
      ${['mnw','th','en'].map(l => `<input class="inp ${l === 'mnw' ? 'mnw' : ''}" value="${esc(L3(k, l))}" placeholder="${l === 'mnw' ? '—' : ''}" onchange="App.setText('${k}','${l}',this.value)">`).join('')}</div>`; }).join('')}

function printSheet(title, inner) {
  const root = $('#print-root'), logo = esc(S.settings.logo || 'assets/logo.jpg');
  root.innerHTML = `<div class="ps"><img class="wm" src="${logo}" alt="">
    <div class="ph"><img src="${logo}" alt=""><div><div class="mnw">${esc(L3('app_name', 'mnw'))}</div><div>${esc(L3('app_name', 'th'))}</div><div style="font-size:10pt">${esc(L3('app_name', 'en'))}</div></div></div>
    ${inner}
    <div class="pf"><span>${esc(title)}</span><span>${esc(T('printed'))} ${fmtDate(todayISO())} · MBSST</span></div></div>`;
  const imgs = [...root.querySelectorAll('img')];

}

/* =========================================================
   ACTIONS
   ========================================================= */
const App = {
  go(v) { location.hash = v; },
  toggleNav(force) { const o = force ?? !$('#sidebar').classList.contains('open'); $('#sidebar').classList.toggle('open', o); $('#scrim').classList.toggle('open', o); },
  setLang(l) { S.settings.lang = l; save(); rerender(); },
  cycleMode() { const o = ['auto', 'light', 'dark']; S.settings.mode = o[(o.indexOf(S.settings.mode) + 1) % 3]; save(); renderChrome(); },
  login() {
    modal({title: `${ICON.lock.replace('<svg', '<svg width="20"')} ${mm(T('admin'))}`,
      body: `${fld(T('pin'), '<input class="inp mono" type="password" id="pin-in" autocomplete="off">')}<p class="small muted">${esc(T(API ? 'pin_hint_remote' : 'pin_hint'))}</p>`,
      actions: [{label: esc(T('cancel'))}, {label: esc(T('login')), cls: 'primary', on: (_, close, btn) => {
        const k = val('pin-in');
        if (!API) {
          if (k !== S.settings.pin) { toast(T('wrong_pin'), 'bad'); $('#pin-in').closest('.fld').classList.add('err'); return false; }
          ADMIN = true; audit('login', 'admin'); save(); rerender(); toast('★ ' + T('admin')); return;
        }
        btn.classList.add('loading');
        api('login', {}, k).then(j => {
          if (j.role !== 'admin') throw new Error('unauthorized');
          KEY.admin = k; try { sessionStorage.setItem('mbsst_admin', k); } catch (e) {}
          close(); toast('★ ' + T('admin')); App.connect();
        }).catch(e => { btn.classList.remove('loading'); apiErr(e); });
        return false;
      }}]});
    setTimeout(() => { const p = $('#pin-in'); p && p.addEventListener('keydown', e => { if (e.key === 'Enter') $('.modal-wrap:last-child .modal-foot .primary').click(); }); }, 50);
  },
  logout() {
    ADMIN = false; KEY.admin = ''; try { sessionStorage.removeItem('mbsst_admin'); } catch (e) {}
    if (VIEW === 'settings') location.hash = 'home';
    if (API) App.connect(); else rerender();
    toast(T('logout'));
  },
  async connect(retry) {
    try {
      const j = await api('bootstrap');
      const d = j.data;
      S.data = {docs: d.Docs || [], requests: d.Requests || [], members: d.Members || [], activities: d.Activities || [], history: d.History || [],
        log: (j.log || []).map(l => ({t: l.time, u: l.role, a: l.action, x: l.target}))};
      S.stats = j.stats || null; S.aiStatus = j.ai || null;
      Object.keys(j.settings || {}).forEach(k => { const v = j.settings[k]; if (SHARED.indexOf(k) >= 0 && v !== '' && v != null) S.settings[k] = v; });
      ROLE = j.role || 'public'; ADMIN = ROLE === 'admin';
      if (SELF && j.self) SELF.id = j.self.id;
      CONNECTED = true; save(); rerender();
    } catch (e) {
      CONNECTED = false;
      if (String(e.message) === 'unauthorized' && !retry) {
        if (KEY.admin) { KEY.admin = ''; try { sessionStorage.removeItem('mbsst_admin'); } catch (_) {} }
        else if (SELF) App.setSelf(null);
        else { KEY.club = ''; try { localStorage.removeItem('mbsst_key'); } catch (_) {} }
        toast(T('session_expired'), 'bad');
        return App.connect(true);
      }
      rerender(); apiErr(e);
    }
  },
  askKey() {
    modal({title: `${ICON.lock.replace('<svg', '<svg width="20"')} ${esc(T('club_key'))}`,
      body: `${fld(T('club_key'), '<input class="inp mono" type="password" id="ck-in" autocomplete="off">', 1)}<p class="small muted">${esc(T('club_key_hint'))}</p>`,
      actions: [{label: esc(T('cancel'))}, {label: esc(T('confirm')), cls: 'primary', on: (_, close, btn) => {
        const k = val('ck-in'); if (!k) return false;
        btn.classList.add('loading');
        api('login', {}, k).then(j => {
          if (j.role === 'admin') { KEY.admin = k; try { sessionStorage.setItem('mbsst_admin', k); } catch (e) {} }
          else { KEY.club = k; try { localStorage.setItem('mbsst_key', k); } catch (e) {} }
          close(); App.connect();
        }).catch(e => { btn.classList.remove('loading'); apiErr(e); });
        return false;
      }}]});
  },

  /* issue */
  pickType(c) { UI.issueType = c; renderView(); window.scrollTo({top: 0, behavior: 'smooth'}); },
  updPreview() {
    const el = $('#pv-no'); if (!el || !UI.issueType) return;
    const d = val('f_date') || todayISO(), y = +d.slice(0, 4);
    const no = fmtNo(UI.issueType, nextSeq(UI.issueType, y), y);
    if (el.textContent !== no) { el.textContent = no; el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  },
  quorum() {
    const p = +val('f_present'), t = +val('f_total'), q = $('#quorum'); if (!q) return;
    if (!p || !t) { q.innerHTML = ''; return; }
    const ok = p / t >= 0.6;
    q.innerHTML = `<div class="quorum st ${ok ? 'approved' : 'void'}">${Math.round(p / t * 100)}% · ${esc(T(ok ? 'quorum_ok' : 'quorum_no'))}</div>`;
  },
  addLinkRow(id) { document.getElementById(id).insertAdjacentHTML('beforeend', linkRow()); },
  codeBuilder(targetId, preset) {
    const p = preset || {};
    const m = modal({title: `${ICON.wand.replace('<svg', '<svg width="20"')} ${esc(T('project_code'))}`, body: `
      <p class="small muted">${esc(T('code_hint'))}</p>
      <div class="fld"><span>${mm(T('objective'))}</span><div class="obj-grid">${OBJECTIVES.map((o, i) => `<label class="obj"><input type="radio" name="cb_obj" value="${o.c}" ${(p.obj || '02') === o.c ? 'checked' : ''} onchange="App.cbUpd()"><div><b>${o.c}</b> ${esc(o.k)} ${esc(L(o))}<span class="mnw">${esc(o.mnw)}</span></div></label>`).join('')}</div></div>
      <div class="row2">${fld(T('program'), `<input class="inp" type="number" min="1" max="99" id="cb_prog" value="${p.prog || 1}" oninput="App.cbUpd()">`)}${fld(T('start'), `<input class="inp" type="date" id="cb_date" value="${p.date || todayISO()}" oninput="App.cbUpd()">`)}</div>
      <div class="code-pv mono" id="cb_pv"></div>`,

  cbUpd() { const o = ($('input[name=cb_obj]:checked') || {}).value || '02'; $('#cb_pv').textContent = projCode(o, +val('cb_prog') || 1, val('cb_date') || todayISO()); },
  submitIssue(status) {
    const t = typeOf(UI.issueType), isIn = t.g === 'in';
    const req = ['f_date', 'f_subject'].concat(isIn ? ['f_from'] : (t.code === 'EXT' ? ['f_to'] : []));
    if (!requireFields(req)) return;
    const date = val('f_date'), y = +date.slice(0, 4);
    const doc = {id: uid(), type: t.code, year: y, date, subject: val('f_subject'), lang: val('f_lang'), to: val('f_to'), from: val('f_from'),
      theirNo: val('f_theirno'), theirDate: val('f_theirdate'), signer: val('f_signer'), assigned: val('f_assigned'),
      ref: val('f_ref'), code: val('f_code'), links: readLinks('f_links'), note: val('f_note'), status, created: nowISO()};
    if (t.code === 'MIN') doc.meeting = {kind: val('f_mkind'), present: +val('f_present') || 0, total: +val('f_total') || 0};
    const preview = fmtNo(t.code, nextSeq(t.code, y), y);
    modal({title: esc(T('confirm_issue')), body: `
      <div style="text-align:center;margin-bottom:14px"><div class="pv-no mono" style="display:inline-block">${esc(preview)}</div></div>
      <dl class="kv"><dt>${esc(T('type'))}</dt><dd>${badge(t.code)} ${mm(L(t.n))}</dd><dt>${esc(T('date'))}</dt><dd>${fmtDate(date)}</dd>
      <dt>${esc(T('subject'))}</dt><dd>${mm(doc.subject)}</dd>${isIn ? `<dt>${esc(T('from'))}</dt><dd>${mm(doc.from)}</dd>` : `<dt>${esc(T('to'))}</dt><dd>${mm(doc.to) || '—'}</dd><dt>${esc(T('signer'))}</dt><dd>${mm(role(doc.signer))}</dd>`}
      ${doc.code ? `<dt>${esc(T('project_code'))}</dt><dd class="mono">${esc(doc.code)}</dd>` : ''}${doc.ref ? `<dt>${esc(T('ref'))}</dt><dd class="mono">${esc(doc.ref)}</dd>` : ''}
      <dt>${esc(T('status'))}</dt><dd>${stChip(status)}</dd></dl>`,
      actions: [{label: esc(T('cancel'))}, {label: `${ICON.stamp} ${esc(T('confirm'))}`, cls: 'primary', on: () => {
        if (API) toast(T('working'));
        App.commitIssue(doc).then(saved => setTimeout(() => App.stampModal(saved), 220)).catch(apiErr);
      }}]});
  },
  async commitIssue(doc) {
    if (!API) { doc.seq = nextSeq(doc.type, doc.year); doc.no = fmtNo(doc.type, doc.seq, doc.year); S.data.docs.push(doc); audit(doc.status, doc.no); save(true); return doc; }
    const j = await api('issue', {doc: Object.assign({}, doc, {digits: (typeOf(doc.type) || {}).d || 3})});
    S.data.docs.push(j.doc);
    return j.doc;
  },
  async saveDoc(d, patch, msg) {
    try { const saved = await persist('docs', Object.assign({}, d, patch)); Object.assign(d, saved); audit('edit', d.no); save(); renderView(); toast(msg || T('saved')); }
    catch (e) { apiErr(e); }
  },
  stampModal(doc, x, y) {
    const m = modal({title: `${ICON.check.replace('<svg', '<svg width="20" style="color:var(--ok)"')} ${esc(T('issued_title'))}`, body: `
      <div class="stamp-wrap"><div class="stamp"><small>MBSST</small><b class="mono">${esc(doc.no)}</b><span>${fmtDate(doc.date)}</span></div></div>
      <p style="text-align:center">${mm(doc.subject)}</p>`,
      actions: [{label: `${ICON.copy} ${esc(T('copy'))}`, on: () => { copyText(doc.no); return false; }},
                {label: `${ICON.print} ${esc(T('print'))}`, on: () => { App.printDoc(doc.id); return false; }},
                {label: esc(T('go_registry')), on: () => { UI.issueType = null; location.hash = 'registry'; }},
                {label: `${ICON.plus} ${esc(T('issue_another'))}`, cls: 'primary', on: () => renderView()}]});
    burst(innerWidth / 2, innerHeight / 2 - 40);
    renderView();

  openDoc(id) {

          ${fld(T('start'), `<input class="inp" type="date" id="r_start" value="${todayISO()}" oninput="App.reqCode()">`, 1)}${fld(T('end'), '<input class="inp" type="date" id="r_end">')}</div>
        <div class="fld"><span>${esc(T('project_code'))}</span><div class="code-pv mono" id="r_code"></div><span class="small muted">${esc(T('code_hint'))}</span></div>`
      : `${fld(T('req_related'), `<select class="inp" id="r_rel"><option value="">—</option>${prjCodes.map(c => `<option>${esc(c)}</option>`).join('')}</select>`, 1)}
        <div class="fld"><span>${esc(T('item'))}</span><table class="items"><thead><tr><th>${esc(T('item'))}</th><th style="width:80px">${esc(T('qty'))}</th><th style="width:110px">${esc(T('price'))}</th><th style="width:100px">${esc(T('total'))}</th><th></th></tr></thead><tbody id="r_items"></tbody>
          <tfoot><tr><td colspan="3" style="text-align:right"><b>${esc(T('total'))}</b></td><td><b id="r_sum">0</b></td><td></td></tr></tfoot></table>
          <button type="button" class="btn ghost sm" onclick="App.addItem()">${ICON.plus} ${esc(T('add_item'))}</button></div>`}
      ${fld(T('desc'), '<textarea class="inp" id="r_desc" rows="3"></textarea>')}

        <div class="files" id="r_files"></div><span class="small muted">${esc(T('drop_note'))}</span></div>
      <div class="fld"><span>${esc(T('links'))}</span>${linksEditor('r_links')}</div>`);

  },
  payCalc() {
    const e = $('#p_left'); if (!e) return;
    const b = payBudget({id: '', kind: 'PAY', amount: +val('r_amount') || 0, items: {cat: ($('input[name=p_cat]:checked') || {}).value, fy: PAY_FY}});
    if (!b) { e.textContent = ''; return; }
    e.classList.toggle('bad', b.after < 0);
    e.innerHTML = `${esc(T('b_approved'))} <b>${money(b.alloc)}</b> · ${esc(T('b_before'))} <b>${money(b.before)}</b> · ${esc(T(b.after < 0 ? 'over_budget' : 'b_after'))} <b>${money(b.after)}</b>`;
  },
  switchReq(k) { if (App._reqModal) App._reqModal.close(); setTimeout(() => App.newRequest(k), 210); },
  reqCode() { const o = ($('input[name=r_obj]:checked') || {}).value || '02'; const c = projCode(o, +val('r_prog') || 1, val('r_start')); const e = $('#r_code'); if (e) e.textContent = c || '—'; },
  addItem() {
    $('#r_items').insertAdjacentHTML('beforeend', `<tr><td><input class="inp" data-k="name"></td><td><input class="inp" type="number" min="0" data-k="qty" value="1" oninput="App.sumItems()"></td><td><input class="inp" type="number" min="0" data-k="price" value="0" oninput="App.sumItems()"></td><td class="mono" data-k="tot">0</td><td><button type="button" class="icon-btn" onclick="this.closest('tr').remove();App.sumItems()">${ICON.x}</button></td></tr>`);
  },
  sumItems() {
    let s = 0;
    $$('#r_items tr').forEach(tr => { const t = (+tr.querySelector('[data-k=qty]').value || 0) * (+tr.querySelector('[data-k=price]').value || 0); tr.querySelector('[data-k=tot]').textContent = money(t); s += t; });
    $('#r_sum').textContent = money(s); $('#r_amount').value = s;
  },
  bindDrop() {
    const z = $('#r_drop'), inp = $('#r_file');
    const add = fl => { [...fl].forEach(f => { if (f.size > 8 * 1024 * 1024) { toast(f.name + ' > 8 MB', 'bad'); return; } UI.files.push({name: f.name, size: f.size, file: f}); }); App.drawFiles(); };
    inp.onchange = () => add(inp.files);
    ['dragenter', 'dragover'].forEach(e => z.addEventListener(e, ev => { ev.preventDefault(); z.classList.add('over'); }));
    ['dragleave', 'drop'].forEach(e => z.addEventListener(e, ev => { ev.preventDefault(); z.classList.remove('over'); }));
    z.addEventListener('drop', ev => add(ev.dataTransfer.files));
  },
  drawFiles() {
    $('#r_files').innerHTML = UI.files.map((f, i) => `<div class="file">${ICON.file.replace('<svg', '<svg width="16"')}<span class="grow">${esc(f.name)}</span><span class="muted">${(f.size / 1024).toFixed(0)} KB</span><button type="button" class="icon-btn" style="width:28px;height:28px" onclick="App.rmFile(${i})">${ICON.x}</button></div>`).join('');
  },
  rmFile(i) { UI.files.splice(i, 1); App.drawFiles(); },
  submitReq(kind, btn, close) {
    if (!requireFields(kind === 'PRJ' ? ['r_title', 'r_prop', 'r_start'] : kind === 'BUD' ? ['r_title', 'r_prop', 'r_rel'] : ['r_prop', 'p_payee', 'r_title', 'r_amount', 'r_desc'])) return false;
    const r = {id: uid(), kind, title: val('r_title'), proposer: val('r_prop'), amount: +val('r_amount') || 0, desc: val('r_desc'), files: [], links: readLinks('r_links'),
      status: 'submitted', history: [{at: todayISO(), st: 'submitted'}], items: []};
    if (kind === 'PRJ') Object.assign(r, {objective: ($('input[name=r_obj]:checked') || {}).value, program: +val('r_prog') || 1, start: val('r_start'), end: val('r_end'), code: $('#r_code').textContent});
    else if (kind === 'BUD') {
      r.code = val('r_rel'); r.objective = r.code.slice(0, 2);
      r.items = $$('#r_items tr').map(tr => ({name: tr.querySelector('[data-k=name]').value.trim(), qty: +tr.querySelector('[data-k=qty]').value || 0, price: +tr.querySelector('[data-k=price]').value || 0})).filter(i => i.name);
    } else {
      const ck = n => ($(`input[name=${n}]:checked`) || {}).value || '';
      r.code = val('r_rel'); r.objective = r.code.slice(0, 2);
      r.items = {fy: PAY_FY, dept: val('p_dept'), payee: val('p_payee'), phone: val('p_phone'), sup: val('p_sup'), contact: val('p_contact'),
        cat: ck('p_cat'), method: ck('p_method'), budget: val('p_budget'), voucher: val('p_voucher'), ptype: ck('p_type'), need: val('p_need'), pri: ck('p_pri'),
        docs: $$('input[name=p_docs]:checked').map(x => x.value), docOther: val('p_docother'), paid: null};
    }
    const b = btn.getBoundingClientRect();
    btn.classList.add('loading');
    (async () => {
      try {
        if (API) {
          for (const f of UI.files) {
            if (!f.file) continue;
            toast(T('uploading') + ' ' + f.name);
            const j = await api('upload', {name: f.name, mime: f.file.type || 'application/octet-stream', data: await fileToB64(f.file)});
            r.files.push({name: j.file.name, size: j.file.size, url: j.file.url});
          }
          S.data.requests.push(await persist('requests', r));
        } else {
          r.files = UI.files.map(f => ({name: f.name, size: f.size}));
          S.data.requests.push(r); audit('request', r.kind + ' ' + r.title); save(true);
        }
        close(); burst(b.left + b.width / 2, b.top);
        toast(T('st_submitted') + ' · ' + r.title);
        if (VIEW !== 'requests') location.hash = 'requests'; else renderView();
      } catch (e) { btn.classList.remove('loading'); apiErr(e); }
    })();
    return false;
  },

  async aiSend(text) {
    const inp = $('#ai_in');
    text = String(text || (inp ? inp.value : '')).trim();
    if (!text || UI.ai.busy) return;
    const cur = aiCur();
    if (!cur.m) { toast(T('ai_need_model'), 'bad'); return; }
    if (cur.p !== 'local' && !API) { toast(T('ai_need_server'), 'bad'); return; }
    UI.ai.provider = cur.p; UI.ai.model = cur.m;
    const q = {role: 'user', content: text};
    UI.ai.msgs.push(q); UI.ai.busy = true;
    if (inp) inp.value = '';
    App.aiRender();
    const msgs = UI.ai.msgs.filter(m => !m.err).map(m => ({role: m.role, content: m.content}));
    try {
      const sys = aiSystem();
      const r = cur.p === 'local' ? await aiLocalCall(cur.m, sys, msgs) : await api('ai', {provider: cur.p, model: cur.m, system: sys, messages: msgs});
      UI.ai.msgs.push({role: 'assistant', content: r.text || '—', label: `${AI_PROV[cur.p]} · ${r.model || cur.m}`, usage: r.usage});
      if (r.usage) { UI.ai.tin += r.usage.in || 0; UI.ai.tout += r.usage.out || 0; }
      if (S.aiStatus && cur.p !== 'local') S.aiStatus.used = (S.aiStatus.used || 0) + 1;
    } catch (e) {
      q.err = true;
      UI.ai.msgs.push({role: 'assistant', err: true, content: aiErrText(e), label: `${AI_PROV[cur.p]} · ${cur.m}`});
    }
    UI.ai.busy = false;
    App.aiRender();
  },
