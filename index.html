    const d = S.data.docs.find(x => x.id === id); if (!d) return;
    const t = typeOf(d.type) || {n: {}}, isIn = t.g === 'in', mt = d.meeting;
    const kv = (k, v) => v ? `<b>${esc(T(k))}</b><span>${mm(v)}</span>` : '';
    let inner = `${d.status === 'void' ? `<div class="void">${esc(T('st_void'))}</div>` : ''}
      <h2>${isIn ? esc(T('rcv_slip')) : mm(L(t.n))}</h2>
      <div class="row"><div>${esc(T('number'))} <b class="mono">${esc(d.no)}</b></div><div>${esc(T('date'))} ${fmtDate(d.date)}</div></div>
      <div class="kv">${kv('subject', d.subject)}${isIn ? kv('from', d.from) + kv('their_no', d.theirNo) + kv('their_date', d.theirDate ? fmtDate(d.theirDate) : '') + kv('assigned', role(d.assigned)) : kv('to', d.to)}
        ${kv('ref', d.ref)}${kv('project_code', d.code)}${mt ? kv('meeting_kind', T(mt.kind)) + kv('present', `${mt.present}/${mt.total}${mt.total ? ` (${Math.round(mt.present / mt.total * 100)}%)` : ''}`) : ''}
        ${(d.links || []).length ? `<b>${esc(T('links'))}</b><span>${d.links.map(l => esc(l.label ? l.label + ': ' + l.url : l.url)).join('<br>')}</span>` : ''}${kv('note', d.note)}</div>`;
    if (!isIn) inner += `<div class="body">${esc(T('body_space'))}</div><div class="sign">(......................................................)<br>${mm(role(d.signer))}</div>`;
    else inner += `<div class="signs"><div>(............................)<br>${mm(role('office'))}</div><div>(............................)<br>${mm(role(d.assigned))}</div></div>`;
    printSheet(d.no, inner);
  },
  printRegister() {
    const rows = UI.lastRows || [];
    const f = UI.reg, isIn = f.tab === 'in';
    printSheet(T('register_title'), `<h2>${esc(T('register_title'))} · ${mm(T(f.tab === 'in' ? 'tab_in' : f.tab === 'out' ? 'tab_out' : 'all'))}${f.year ? ' · ' + f.year : ''}${f.type ? ' · ' + f.type : ''}</h2>
      <table><thead><tr><th>#</th><th>${esc(T('number'))}</th><th>${esc(T('date'))}</th><th>${esc(T('subject'))}</th><th>${esc(isIn ? T('from') : T('to'))}</th><th>${esc(T('project_code'))}</th><th>${esc(T('status'))}</th></tr></thead>
      <tbody>${rows.map((d, i) => `<tr><td>${i + 1}</td><td class="mono">${esc(d.no)}</td><td>${fmtDate(d.date)}</td><td>${mm(d.subject)}</td><td>${mm((typeOf(d.type) || {}).g === 'in' ? d.from : d.to)}</td><td class="mono">${esc(d.code)}</td><td>${esc(T('st_' + d.status))}</td></tr>`).join('')}</tbody></table>`);
  },
  printRequest(id) {
    const r = S.data.requests.find(x => x.id === id); if (!r) return;
    if (r.kind === 'PAY') return App.printPay(r);
    const obj = OBJECTIVES.find(o => o.c === r.objective);
    const sum = r.items.reduce((a, i) => a + i.qty * i.price, 0);
    printSheet(r.docNo || r.code || r.title, `<h2>${esc(T('req_form'))} · ${esc(T(r.kind === 'PRJ' ? 'req_prj' : 'req_bud'))}</h2>
      <div class="kv"><b>${esc(T('subject'))}</b><span>${mm(r.title)}</span><b>${esc(T('project_code'))}</b><span class="mono">${esc(r.code || '—')}</span>
        <b>${esc(T('objective'))}</b><span>${obj ? `${obj.c} ${esc(obj.k)} ${esc(L(obj))}` : '—'}</span><b>${esc(T('proposer'))}</b><span>${mm(r.proposer)}</span>
        ${r.start ? `<b>${esc(T('start'))} – ${esc(T('end'))}</b><span>${fmtDate(r.start)} – ${fmtDate(r.end)}</span>` : ''}
        <b>${esc(T('amount'))}</b><span>${money(r.amount)}</span>${r.docNo ? `<b>${esc(T('number'))}</b><span class="mono">${esc(r.docNo)}</span>` : ''}<b>${esc(T('status'))}</b><span>${esc(T('st_' + r.status))}</span></div>
      ${r.items.length ? `<table><thead><tr><th>${esc(T('item'))}</th><th>${esc(T('qty'))}</th><th>${esc(T('price'))}</th><th>${esc(T('total'))}</th></tr></thead><tbody>${r.items.map(i => `<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${money(i.price)}</td><td>${money(i.qty * i.price)}</td></tr>`).join('')}<tr><td colspan="3" style="text-align:right"><b>${esc(T('total'))}</b></td><td><b>${money(sum)}</b></td></tr></tbody></table>` : ''}
      ${r.desc ? `<p><b>${esc(T('desc'))}</b><br>${mm(r.desc)}</p>` : ''}
      <div class="signs"><div>(............................)<br>${esc(T('sign_proposer'))}</div><div>(............................)<br>${mm(T('sign_treasurer'))}</div><div>(............................)<br>${mm(T('sign_president'))}</div></div>`);
  },
  printPay(r) {
    const p = payOf(r), b = payBudget(r), pd = p.paid || {}, lg = lang();
    const mn = k => L3(k, 'mnw');
    const tr = k => lg !== 'mnw' && mn(k) && T(k) !== mn(k) ? T(k) : '';
    const lb = k => `<span class="mnw">${esc(mn(k) || T(k))}</span>${tr(k) ? `<br><small>${esc(tr(k))}</small>` : ''}`;
    const li = k => `<span class="mnw">${esc(mn(k) || T(k))}</span>${tr(k) ? ` <small>(${esc(tr(k))})</small>` : ''}`;
    const box = on => on ? '☑' : '☐';
    const opt = (keys, pre, cur) => keys.map(k => `${box(k === cur)} ${li(pre + k)}`).join('&nbsp;&nbsp; ');
    const v = s => s ? mm(String(s)) : '';
    const row = (k1, v1, k2, v2) => `<tr><td>${lb(k1)}</td><td>${v1}</td><td>${lb(k2)}</td><td>${v2}</td></tr>`;
    const sec = (k, n = 4) => `<tr><th colspan="${n}" class="sec">${li(k)}</th></tr>`;
    const thb = n => n === '' || n == null ? '' : money(n) + ' THB';
    const reqDate = (r.history[0] || {}).at;
    const line = '……………………………';
    const signCell = (head, name, date) => `<td><b>${li(head)}</b><br>${li('sg_name')}: ${name ? v(name) : line}<br>${li('sg_sign')}: ${line}<br>${li('sg_date')}: ${date ? fmtDate(date) : line}</td>`;
    const docs = PAY_DOCS.map(k => `${box((p.docs || []).includes(k))} ${li('ds_' + k)}${k === 'other' && p.docOther ? ' – ' + mm(p.docOther) : ''}`).join('&nbsp;&nbsp; ');
    printSheet(r.docNo || 'PRF-MBSST', `
      <div class="ptitle"><div class="mnw">${esc(mn('pay_form'))}</div><div>Payment Request Form${lg === 'th' ? ' · ' + esc(T('pay_form')) : ''}</div><small>${li('pay_sub')}</small></div>
      <table class="pt">
        ${row('pay_no', `<span class="mono">${esc(r.docNo || 'PRF-MBSST- ________')}</span>`, 'pay_reqdate', reqDate ? fmtDate(reqDate) : '')}
        ${row('pay_need', p.need ? fmtDate(p.need) : '', 'pay_pri', opt(['normal', 'urgent'], 'pri_', p.pri))}
        ${sec('pay_s1')}
        ${row('pay_requester', v(r.proposer), 'pay_dept', v(p.dept))}
        ${row('pay_payee', v(p.payee), 'pay_phone', v(p.phone))}
        ${row('pay_sup', v(p.sup), 'pay_contact', v(p.contact))}
        ${sec('pay_s2')}
        ${row('pay_purpose', v(r.title), 'pay_amount', `<b>${thb(r.amount)}</b>`)}
        ${row('pay_cat', opt(PAY_CATS.map(c => c.k), 'cat_', p.cat), 'pay_method', opt(['bank', 'cash'], 'pm_', p.method))}
        ${row('pay_budget', v(p.budget), 'pay_voucher', v(p.voucher))}
        ${row('pay_plan', r.code ? `<span class="mono">${esc(r.code)}</span>` : '', 'pay_type', opt(PAY_TYPES, 'pt_', p.ptype))}
        <tr><td colspan="4"><small>${li('pay_annual')} – ${PAY_CATS.map(c => `<span class="mnw">${esc(c.line)}</span> ${money(c.a)}`).join(' | ')} THB</small></td></tr>
        ${sec('pay_s3')}
        ${row('b_approved', b ? thb(b.alloc) : '', 'b_before', b ? thb(b.before) : '')}
        ${row('b_this', thb(r.amount), 'b_after', b ? thb(b.after) : '')}
        <tr><td>${lb('b_check')}</td><td colspan="3">${opt(['in', 'move', 'out'], 'bc_', b ? b.check : '')}</td></tr>
        ${sec('pay_s4')}
        <tr><td>${lb('pay_reason')}</td><td colspan="3" style="height:20mm">${v(r.desc)}</td></tr>
        <tr><td>${lb('pay_docs')}</td><td colspan="3">${docs}</td></tr>
      </table>
      <table class="pt sg">
        ${sec('pay_s5', 3)}
        <tr>${signCell('s_req', r.proposer, '')}${signCell('s_chk', '', '')}${signCell('s_apv', '', '')}</tr>
        ${sec('pay_s6', 3)}
        <tr>${signCell('s_payer', '', '')}
          <td><b>${li('s_paid')}</b><br>${li('paid_date')}: ${pd.date ? fmtDate(pd.date) : line}<br>${li('paid_ref')}: ${pd.ref ? esc(pd.ref) : line}<br>${li('paid_amt')}: ${pd.amt != null && pd.date ? thb(pd.amt) : line}</td>
          ${signCell('s_recv', p.payee, '')}</tr>
      </table>`);
  },
  printMember(id) {
    const m = S.data.members.find(x => x.id === id); if (!m) return;
    const priv = ADMIN || (!!SELF && SELF.id === id);
    const kv = (k, v) => v ? `<b>${esc(T(k))}</b><span>${mm(String(v))}</span>` : '';
    printSheet(m.no || m.name, `${m.photo && safeImg(m.photo) ? `<img class="pphoto" src="${esc(safeImg(m.photo))}" alt="">` : ''}
      <h2 style="text-align:left">${mm(m.name)}</h2>${m.nameAlt ? `<div>${mm(m.nameAlt)}</div>` : ''}
      <div class="kv">${kv('mem_no', m.no)}${kv('role', role(m.role))}${kv('status', T('ms_' + m.status))}${kv('univ', m.univ)}${kv('faculty', m.faculty)}${kv('level', m.level ? T(m.level) : '')}
        ${kv('hometown', m.hometown)}${kv('ordained', m.ordained)}${kv('joined', m.joined)}${priv ? kv('phone', m.phone) + kv('email', m.email) + kv('contact', m.contact) + kv('birth', m.birth ? fmtDate(m.birth) : '') + kv('address', m.address) : ''}</div>
      ${m.bio ? `<div style="clear:both;margin-top:10px"><b>${esc(T('bio'))}</b><div class="bio">${mm(m.bio)}</div></div>` : ''}
      ${m.cv ? `<div style="clear:both;margin-top:10px"><b>${esc(T('cv'))}</b><div class="bio">${mm(m.cv)}</div></div>` : ''}
      ${(m.works || []).length ? `<div style="clear:both;margin-top:10px"><b>${esc(T('works'))}</b><ol>${m.works.map(w => `<li>${mm(w.title || '')}${w.year ? ' (' + esc(w.year) + ')' : ''}${w.url ? ` — <span class="mono" style="font-size:9pt">${esc(w.url)}</span>` : ''}</li>`).join('')}</ol></div>` : ''}`);
  },
  editActivity(id) {
    const a = S.data.activities.find(x => x.id === id) || {date: todayISO(), title: {}};
    const isNew = !a.id;
    modal({title: `${ICON.cal.replace('<svg', '<svg width="20"')} ${esc(isNew ? T('act_add') : T('edit'))}`, size: 'lg', body: `
      <div class="row2">${fld(T('date'), `<input class="inp" type="date" id="a_date" value="${a.date}">`, 1)}${fld(T('place'), `<input class="inp" id="a_place" value="${esc(a.place)}">`)}</div>
      <div class="fld"><span>${esc(T('subject'))} (၃ ภาษา)</span>${tri('a_t', a.title)}</div>
      ${fld(T('desc'), `<textarea class="inp" id="a_desc" rows="3">${esc(a.desc)}</textarea>`)}
      <div class="row3">${fld(T('links'), `<input class="inp" type="url" id="a_link" value="${esc(a.link)}" placeholder="https://">`)}${fld(T('image_url'), `<input class="inp" type="url" id="a_img" value="${esc(a.image)}" placeholder="https://">`)}${fld(T('project_code'), `<input class="inp mono" id="a_code" list="dl-codes" value="${esc(a.code)}">`)}</div>${datalists()}`,
      actions: [...(isNew ? [] : [{label: `${ICON.trash} ${esc(T('delete'))}`, cls: 'danger', on: () => { removeRemote('activities', id).then(() => { S.data.activities = S.data.activities.filter(x => x.id !== id); save(); renderView(); }).catch(apiErr); }}]),
        {label: esc(T('cancel'))}, {label: `${ICON.check} ${esc(T('save'))}`, cls: 'primary', on: () => {
          const title = readTri('a_t');
          if (!val('a_date') || !(title.mnw || title.th || title.en)) { toast(T('required'), 'bad'); return false; }
          const o = {date: val('a_date'), place: val('a_place'), title, desc: val('a_desc'), link: val('a_link'), image: val('a_img'), code: val('a_code')};
          const obj = isNew ? Object.assign({id: uid()}, o) : Object.assign({}, a, o);
          persist('activities', obj).then(sv => { if (isNew) S.data.activities.push(sv); else Object.assign(a, sv); audit('activity', L(title)); save(); renderView(); toast(T('saved')); }).catch(apiErr);
        }}]});
  },
  editHistory(id) {
    const h = S.data.history.find(x => x.id === id) || {date: todayISO(), title: {}, desc: {}};
    const isNew = !h.id;
    modal({title: `${ICON.clock.replace('<svg', '<svg width="20"')} ${esc(isNew ? T('hist_add') : T('edit'))}`, size: 'lg', body: `
      ${fld(T('date'), `<input class="inp" type="date" id="h_date" value="${h.date}">`, 1)}
      <div class="fld"><span>${esc(T('subject'))}</span>${tri('h_t', h.title)}</div>
      <div class="fld"><span>${esc(T('desc'))}</span>${tri('h_d', h.desc)}</div>`,
      actions: [...(isNew ? [] : [{label: `${ICON.trash} ${esc(T('delete'))}`, cls: 'danger', on: () => { removeRemote('history', id).then(() => { S.data.history = S.data.history.filter(x => x.id !== id); save(); renderView(); }).catch(apiErr); }}]),
        {label: esc(T('cancel'))}, {label: `${ICON.check} ${esc(T('save'))}`, cls: 'primary', on: () => {
          const title = readTri('h_t');
          if (!val('h_date') || !(title.mnw || title.th || title.en)) { toast(T('required'), 'bad'); return false; }
          const o = {date: val('h_date'), title, desc: readTri('h_d')};
          const obj = isNew ? Object.assign({id: uid()}, o) : Object.assign({}, h, o);
          persist('history', obj).then(sv => { if (isNew) S.data.history.push(sv); else Object.assign(h, sv); audit('history', L(title)); save(); renderView(); toast(T('saved')); }).catch(apiErr);
        }}]});
  },

  /* settings */
  setTab(k) { UI.set = k; renderView(); },
  setS(k, v, live) { S.settings[k] = v; save(); shareSet(k); applyTheme(); if (!live) renderChrome(); },
  preset(p, a) { S.settings.primary = p; S.settings.accent = a; save(); shareSet('primary'); shareSet('accent'); rerender(); },
  setFont(l, f) { S.settings.fonts[l] = f; save(); shareSet('fonts'); applyTheme(); renderView(); },
  setText(k, l, v) { S.settings.texts[k] = Object.assign({}, S.settings.texts[k], {[l]: v}); save(); shareSet('texts'); renderChrome(); toast(T('saved')); },
  txtFilter(q) { UI.txtQ = q; clearTimeout(App._tt); App._tt = setTimeout(() => { renderView(); const s = $('#txt-q'); if (s) { s.focus(); s.setSelectionRange(q.length, q.length); } }, 200); },
  txtFlag(b) { UI.txtFlag = b; renderView(); },
  uploadLogo(inp) {
    const f = inp.files[0]; if (!f) return;
    if (f.size > 2 * 1024 * 1024) { toast('> 2 MB', 'bad'); return; }
    if (API) {
      toast(T('uploading') + ' ' + f.name);
      shrinkImage(f, 640).then(url => api('upload', {name: 'logo-' + Date.now() + '.jpg', mime: 'image/jpeg', data: url.split(',')[1], publicLogo: true}))
        .then(j => { S.settings.logo = j.file.thumb; save(); shareSet('logo'); rerender(); toast(T('saved')); }).catch(apiErr);
      return;
    }
    shrinkImage(f, 512).then(url => { S.settings.logo = url; audit('logo', f.name); save(true); rerender(); toast(T('saved')); });
  },
  setType(i, path, v) {
    const t = types()[i];
    if (path.startsWith('n.')) t.n[path.slice(2)] = v; else t[path] = v;
    save(); shareSet('types'); toast(T('saved')); if (path === 'c' || path === 'on') renderView();
  },
  delType(i) { const t = types()[i]; types().splice(i, 1); audit('delete type', t.code); save(); shareSet('types'); renderView(); },
  addType() {
    const code = val('nt_code').toUpperCase();
    if (!/^[A-Z]{3}$/.test(code)) { toast(T('code') + ' A–Z ×3', 'bad'); return; }
    if (typeOf(code)) { toast(code + ' ✕', 'bad'); return; }
    const n = readTri('nt');
    types().push({code, d: +val('nt_d') || 3, g: val('nt_g'), p: val('nt_g') === 'fin' ? 1 : 0, on: 1, c: '#' + Math.floor(Math.random() * 0xaaaaaa).toString(16).padStart(6, '0'), signer: 'president', n: {mnw: n.mnw, th: n.th || code, en: n.en || code}, s: {th: '', en: ''}, v: 0});
    audit('add type', code); save(); shareSet('types'); renderView(); toast(T('saved'));
  },
  saveLinks() { S.settings.links = readLinks('ql').map(l => ({label: l.label || l.url, url: l.url})); save(); shareSet('links'); toast(T('saved')); },
  exportJSON() { download(`MBSST-backup-${todayISO()}.json`, JSON.stringify(S, null, 2), 'application/json'); },
  importJSON(inp) {
    const f = inp.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try { const o = JSON.parse(rd.result); if (!o.settings || !o.data) throw 0; S = o; save(true); rerender(); toast(T('saved')); }
      catch (e) { toast('JSON ✕', 'bad'); }
    };
    rd.readAsText(f);
  },
  clearSamples() {
    ['docs', 'requests', 'activities'].forEach(k => S.data[k] = S.data[k].filter(x => !x.sample));
    audit('clear samples', ''); save(); renderView(); toast(T('saved'));
  },
  resetAll() {
    modal({title: esc(T('reset_all')), body: `<p>${esc(T('reset_confirm'))}</p>`, actions: [{label: esc(T('cancel'))}, {label: esc(T('confirm')), cls: 'danger', on: () => {
      try { localStorage.removeItem(LS_KEY); } catch (e) {}
      S = defaults(); ADMIN = false; location.hash = 'home'; rerender();
    }}]});
  },
  testApi() {
    const u = val('api-in'), st = $('#api-status');
    if (!/^https:\/\/script\.google\.com\//.test(u)) { st.textContent = '✕ URL'; return; }
    st.textContent = '…';
    fetch(u).then(r => r.json()).then(j => { st.textContent = j.ok ? `● OK · ${j.service} v${j.version}` : '✕ ' + (j.error || ''); })
      .catch(e => { st.textContent = '✕ ' + e.message; });
  },
  setApi() {
    const u = val('api-in');
    try { if (u) localStorage.setItem('mbsst_api', u); else localStorage.removeItem('mbsst_api'); } catch (e) {}
    toast(T('api_reload')); setTimeout(() => location.reload(), 700);
  },
  changePin() {
    modal({title: esc(T('change_pin')), body: fld(T('pin'), '<input class="inp mono" id="np" inputmode="numeric" minlength="4">', 1),
      actions: [{label: esc(T('cancel'))}, {label: esc(T('save')), cls: 'primary', on: () => { if (val('np').length < 4) { toast('≥ 4', 'bad'); return false; } S.settings.pin = val('np'); audit('change pin', ''); save(); toast(T('saved')); }}]});
  }
};
window.App = App;
window.rerenderAll = rerenderAll;
window.$ = $;

/* ---------- boot ---------- */
S = load();
if (API) S.data = {docs: [], requests: [], members: [], activities: [], history: [], log: []};
window.LOGO_SVG = logoSVG();
function route() {
  const h = decodeURIComponent((location.hash || '').slice(1)) || (can('member') ? 'home' : 'overview');
  if (h.startsWith('member/')) { VIEW = 'member'; UI.memberId = h.slice(7); }
  else VIEW = VIEWS[h] && h !== 'member' ? h : 'overview';
  if (VIEW !== 'issue') UI.issueType = null;
  renderView();
  $('#main').focus({preventScroll: true});
  window.scrollTo({top: 0});
}
window.addEventListener('hashchange', route);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.settings.mode === 'auto') applyTheme(); });
renderChrome();
route();
if (API) App.connect();
})();
</script>
</body>
</html>
